{%extends "layout.html"%}
{%block container%}


<!-- <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"> -->




<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">

  <a href="#" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Nuevo</a>
  <button type="button" class="text-white bg-success box-border border border-transparent hover:bg-success-strong focus:ring-4 focus:ring-success-medium shadow-xs font-medium leading-5 rounded-full text-sm px-4 py-2.5 focus:outline-none">Success</button>

  <table class="w-full text-sm text-left rtl:text-right text-body">
        <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-default-medium">
            <tr>
                <th scope="col" class="px-6 py-3 font-medium">
                    Nombre
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Apellidos
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Correo
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Teléfono
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Editar
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Detalles
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                   Eliminar
                </th>
            </tr>
        </thead>
        <tbody>
            {%for alum in alumno%}
            <tr class="bg-neutral-primary-soft border-b  border-default">
                <th scope="row" class="px-6 py-4 font-medium text-heading whitespace-nowrap">
                {{alum.nombre}}
                </th>
                <td class="px-6 py-4">
                    {{alum.apaterno}}
                </td>
                <td class="px-6 py-4">
                    {{alum.email}}
                </td>
               <td class="px-6 py-4">
    <a href="modificar?id={{alum.id}}" 
       class="text-white bg-warning box-border border border-transparent 
              hover:bg-warning-strong focus:ring-4 focus:ring-warning-medium 
              shadow-xs font-medium leading-5 rounded-full text-sm 
              px-4 py-2.5 focus:outline-none inline-block text-center">
        Modificar
                </a>
            </td>

            <td class="px-6 py-4">
                <a href="detalles?id={{alum.id}}" 
                class="text-white bg-primary box-border border border-transparent 
                        hover:bg-primary-strong focus:ring-4 focus:ring-primary-medium 
                        shadow-xs font-medium leading-5 rounded-full text-sm 
                        px-4 py-2.5 focus:outline-none inline-block text-center">
                    Detalles
                </a>
            </td>

            <td class="px-6 py-4">
                <a href="eliminar?id={{alum.id}}" 
                class="text-white bg-danger box-border border border-transparent 
                        hover:bg-danger-strong focus:ring-4 focus:ring-danger-medium 
                        shadow-xs font-medium leading-5 rounded-full text-sm 
                        px-4 py-2.5 focus:outline-none inline-block text-center">
                    Eliminar
                </a>
            </td>
            </tr>
             {%endfor%}
        </tbody>
    </table>
</div>
<div class="grid md:grid-cols-2 md:gap-6">
    <input type="submit" id="btn1" name="btn1" value="Registrar">
  <a href="index" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Nuevo</a>
svg

</div>


{% endblock %}
